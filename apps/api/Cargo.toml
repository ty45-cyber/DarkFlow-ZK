[package]
name = "darkflow-api"
version = "0.1.0"
edition = "2021"
authors = ["Midnight Builder"]

[dependencies]
core-math = { path = "../../packages/core-math" }
axum = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.4", features = ["cors"] }